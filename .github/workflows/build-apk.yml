name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el APK en "Releases"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar la clave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ryx-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ryx-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          SERVER_URL: ${{ secrets.SERVER_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nombrar el APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/Ryx-History-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Ryx-History-APK
          path: out/*.apk

      - name: Publicar en Releases (solo con etiquetas v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
