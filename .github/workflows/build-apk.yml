name: Compilar APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el APK en "Releases"

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Preparar la clave de firma
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/ryx-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ryx-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          # En etiquetas v* el APK muestra esa versión (v1.0.5 → 1.0.5)
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          SERVER_URL: ${{ secrets.SERVER_URL }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Nombrar el APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk "out/RyxHistory-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RyxHistory-APK
          path: out/*.apk

      # Con etiqueta v* = versión estable. No se envía target_commitish: la etiqueta ya
      # existe y GitHub rechaza el release si se le pasa un commit en este caso.
      - name: Publicar versión (etiqueta v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: RyxHistory ${{ github.ref_name }}
          prerelease: false
          files: out/*.apk

      # Sin etiqueta = "build-N" marcada como pre-lanzamiento
      - name: Publicar compilación (push a main)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: RyxHistory build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: out/*.apk
